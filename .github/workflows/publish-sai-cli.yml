name: Publish sai-cli

# DEPRECATED (2026-10-28): @simular-ai/sai-cli is no longer released. The tag trigger and
# the publish job are gone; the checks below stay until cli/ is removed.
#
# CI + npm publish for the @simular-ai/sai-cli package (cli).
#
# Checks (lint / typecheck / build / test / smoke) run on every non-draft PR that
# touches the package, and on manual dispatch. Publishing to npmjs.org happens only when
# a tag matching `sai-cli-v*` is pushed — a package-scoped prefix so the app's
# own release tags (agent-v*, etc.) never trigger an npm publish.
#
# Cutting a release:
#   1. Bump "version" in cli/package.json (and keep VERSION in
#      src/version.ts in sync — see the verify step below).
#   2. Merge to main.
#   3. git tag sai-cli-v<X.Y.Z> && git push origin sai-cli-v<X.Y.Z>
#      (use sai-cli-v<X.Y.Z>-rc.N for a prerelease → publishes under dist-tag "next")
#
# Auth: npm trusted publishing (OIDC), same approach as simulang-js's CI. The
# publish job's `id-token: write` permission lets the npm CLI exchange a GitHub
# Actions OIDC token for a short-lived publish token — no NPM_TOKEN secret, so
# anyone able to push a tag can release. Requires the matching trusted-publisher
# config on npmjs.org (package @simular-ai/sai-cli → Settings → Trusted
# Publisher): org "simular-ai", repo "sai-sdk", workflow filename
# "publish-sai-cli.yml", no environment. All fields are exact-match; npm only
# validates them at publish time.
#
# npm skips provenance attestations because this repo is private (a documented
# npm limitation, not an error) — nothing to configure either way.

on:
  # `types` is the default set plus the two draft transitions — see the draft
  # guard on `build` below. `ready_for_review` is what starts the checks for a
  # PR opened as a draft; `converted_to_draft` runs a no-op that cancels the
  # in-flight checks through the concurrency group.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'cli/**'
      - '.github/workflows/publish-sai-cli.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Run the full check suite on every OS we support so platform-specific
    # regressions (e.g. Windows path handling in token-store) are caught in CI,
    # not just on Ubuntu. fail-fast:false so one OS failing still reports the others.
    name: Build & test (${{ matrix.os }})
    # Draft PRs run nothing, same as build.yml: three OS legs on a tree the
    # author is still rewriting is spend with no reader. `ready_for_review`
    # (or the next push after marking it ready) starts them. Non-PR events read
    # `draft` as null.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Don't persist the repo-scoped GITHUB_TOKEN in .git/config — it would
          # otherwise be used by npm's git clones of the private @simular-ai deps
          # (which it can't access), overriding the App token configured below.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint the package and fail on any warnings (the lint script runs
      # `eslint . --max-warnings 0`), so lint/formatting warnings can't slip
      # into a release.
      - name: Lint
        run: npm run lint -w @simular-ai/sai-cli

      - name: Typecheck
        run: npm run typecheck -w @simular-ai/sai-cli

      - name: Build
        run: npm run build -w @simular-ai/sai-cli

      - name: Test
        run: npm run test -w @simular-ai/sai-cli

      - name: Smoke test (--version)
        run: node cli/dist/cli.cjs --version

      - name: Smoke test (--help)
        run: node cli/dist/cli.cjs --help
