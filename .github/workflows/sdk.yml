name: SDKs

# Every SDK's tests. Each suite has three parts:
# - the parity test against surface.json, so a surface change that lands in one language only fails;
# - the conformance cases in conformance/cases, run against the mock server (conformance/README.md);
# - the code snippets in the docs (sai-platform), run against the mock server's fake API.
# The docs change on their own, so this also runs daily against sai-platform main.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'python/**'
      - 'typescript/**'
      - 'conformance/**'
      - 'surface.json'
      - 'package-lock.json'
      - '.github/workflows/sdk.yml'
      - '.github/actions/docs/**'
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'typescript/**'
      - 'conformance/**'
      - 'surface.json'
      - 'package-lock.json'
      - '.github/workflows/sdk.yml'
      - '.github/actions/docs/**'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance suite
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'
      - run: node conformance/selftest.mjs

  python:
    name: Python ${{ matrix.python }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The mock server is Node.
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'
      - uses: ./.github/actions/docs
        with:
          app-id: ${{ vars.SIMULAR_CI_APP_ID }}
          private-key: ${{ secrets.SIMULAR_CI_APP_PRIVATE_KEY }}
      - run: pipx install uv
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest
      - run: uv build

  typescript:
    name: TypeScript
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: ./.github/actions/docs
        with:
          app-id: ${{ vars.SIMULAR_CI_APP_ID }}
          private-key: ${{ secrets.SIMULAR_CI_APP_PRIVATE_KEY }}
      - run: npm ci
      - run: npx eslint --max-warnings 0 typescript conformance
      - run: npm run typecheck -w @simular-ai/sai-sdk
      # The docs snippets import the built package.
      - run: npm run build -w @simular-ai/sai-sdk
      - run: npm test -w @simular-ai/sai-sdk
