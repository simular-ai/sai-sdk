name: SDKs

# Every SDK's tests. Each suite has three parts:
# - the parity test against surface.json, so a surface change that lands in one language only fails;
# - the conformance cases in conformance/cases, run against the mock server (conformance/README.md);
# - the code snippets of the docs (sai-platform), snapshotted in conformance/snippets, run against
#   the mock server's fake API. Refresh the snapshot with `node conformance/snippets.mjs sync`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'python/**'
      - 'typescript/**'
      - 'go/**'
      - 'java/**'
      - 'dotnet/**'
      - 'ruby/**'
      - 'conformance/**'
      - 'surface.json'
      - 'package-lock.json'
      - '.github/workflows/sdk.yml'
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'typescript/**'
      - 'go/**'
      - 'java/**'
      - 'dotnet/**'
      - 'ruby/**'
      - 'conformance/**'
      - 'surface.json'
      - 'package-lock.json'
      - '.github/workflows/sdk.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance suite
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'
      - run: node conformance/selftest.mjs

  python:
    name: Python ${{ matrix.python }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The mock server is Node.
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'
      - run: pipx install uv
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest
      - run: uv build

  typescript:
    name: TypeScript
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx eslint --max-warnings 0 typescript conformance
      - run: npm run typecheck -w @simular-ai/sai-sdk
      # The docs snippets import the built package.
      - run: npm run build -w @simular-ai/sai-sdk
      - run: npm test -w @simular-ai/sai-sdk

  go:
    name: Go
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The mock server is Node.
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'
      # The oldest Go the module supports (go.mod).
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go/go.mod'
          cache: false
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go test ./...

  java:
    name: Java ${{ matrix.java }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The mock server is Node.
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify

  dotnet:
    name: .NET
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The mock server is Node.
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'
      # The package targets net8.0 and net10.0; the tests run on net10.0.
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test
      - run: dotnet pack -c Release

  ruby:
    name: Ruby ${{ matrix.ruby }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.4']
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The mock server is Node.
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ruby
      - run: bundle exec rake test
      - run: gem build sai-sdk.gemspec
