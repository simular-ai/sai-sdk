name: Publish sai-sdk (TypeScript)

# Publishes the TypeScript SDK (typescript/) to npm as @simular-ai/sai-sdk.
# Tests run in sdk.yml on every PR; this workflow only releases.
#
# Cutting a release:
#   1. Bump "version" in typescript/package.json and VERSION in typescript/src/version.ts.
#   2. Merge to main.
#   3. git tag sai-sdk-ts-v<X.Y.Z> && git push origin sai-sdk-ts-v<X.Y.Z>
#      (sai-sdk-ts-v<X.Y.Z>-alpha.N etc. → dist-tag "next")
#
# Auth: npm trusted publishing (OIDC). Requires the trusted-publisher config on
# npmjs.org (package @simular-ai/sai-sdk → Settings → Trusted Publisher): org
# "simular-ai", repo "sai-sdk", workflow "publish-sai-sdk-ts.yml", no environment.

on:
  push:
    tags:
      - 'sai-sdk-ts-v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build, test & publish to npm
    if: startsWith(github.ref, 'refs/tags/sai-sdk-ts-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # GitHub Release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # no registry-url: setup-node would write an _authToken that shadows the OIDC handshake
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @simular-ai/sai-sdk
      - run: npm test -w @simular-ai/sai-sdk
      - name: Verify tag matches package version & pick dist-tag
        id: release
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/sai-sdk-ts-v}"
          PKG_VERSION="$(node -p "require('./typescript/package.json').version")"
          CODE_VERSION="$(sed -nE "s/^export const VERSION = '([^']+)'.*/\\1/p" typescript/src/version.ts)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$PKG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::tag $TAG_VERSION, package.json $PKG_VERSION, version.ts $CODE_VERSION must match." >&2
            exit 1
          fi
          if echo "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          else echo "dist-tag=next" >> "$GITHUB_OUTPUT"; fi
      - run: npm run build -w @simular-ai/sai-sdk
      - run: npm publish -w @simular-ai/sai-sdk --access public --tag "${{ steps.release.outputs.dist-tag }}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          PRERELEASE_FLAG: ${{ steps.release.outputs.dist-tag == 'next' && '--prerelease' || '' }}
        run: gh release create "$TAG_NAME" -R "$GITHUB_REPOSITORY" --title "$TAG_NAME" --generate-notes $PRERELEASE_FLAG
