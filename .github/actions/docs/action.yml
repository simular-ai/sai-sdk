name: Check out the docs
description: >
  Checks out simular-ai/sai-platform, whose docs pages hold the code snippets the SDK tests run,
  and points the tests at them. It takes the docs branch with this branch's name when there is
  one, so an SDK change and its docs change are tested together; otherwise main.

inputs:
  app-id:
    required: true
  private-key:
    required: true

runs:
  using: composite
  steps:
    # The CI GitHub App needs Contents: read on sai-platform.
    - name: Mint a docs token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: simular-ai
        repositories: sai-platform

    - name: Pick the docs branch
      id: ref
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        if gh api "repos/simular-ai/sai-platform/branches/$BRANCH" --silent 2>/dev/null; then
          echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
        else
          echo "ref=main" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: simular-ai/sai-platform
        ref: ${{ steps.ref.outputs.ref }}
        token: ${{ steps.token.outputs.token }}
        path: .docs/sai-platform
        sparse-checkout: src/docs/content
        persist-credentials: false

    - name: Point the tests at the docs
      shell: bash
      run: |
        echo "Docs: sai-platform@${{ steps.ref.outputs.ref }}"
        echo "SAI_DOCS_DIR=$GITHUB_WORKSPACE/.docs/sai-platform/src/docs/content" >> "$GITHUB_ENV"
        echo "SAI_DOCS_REQUIRED=1" >> "$GITHUB_ENV"
